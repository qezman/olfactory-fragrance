replicaCount: 2

image:
  repository: ""        # set via Jenkins: --set image.repository=$ECR_REGISTRY/olfactory-frontend
  tag: "latest"         # set via Jenkins: --set image.tag=$IMAGE_TAG
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: nginx
  host: olfactory.example.com   # replace with your domain
  tls:
    enabled: true
    secretName: olfactory-tls

env:
  NEXT_PUBLIC_API_URL: "http://olfactory-fragrance-backend/api"
  NODE_ENV: "production"
  PORT: "3000"

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

readinessProbe:
  path: /
  initialDelaySeconds: 10
  periodSeconds: 5

livenessProbe:
  path: /
  initialDelaySeconds: 20
  periodSeconds: 15
