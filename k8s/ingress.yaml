apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: olfactory-frontend
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: olfactory.example.com   # replace with your actual domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: olfactory-frontend
                port:
                  number: 80
  tls:
    - hosts:
        - olfactory.example.com
      secretName: olfactory-tls
